name: Publish Debian Repo
on:
  push:
    tags:
      - '*.*.*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            debhelper \
            devscripts \
            fakeroot \
            git \
            gnupg \
            nodejs \
            npm \
            reprepro \
            scdoc
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Build Debian packages
        env:
          BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/debian-artifacts
        run: |
          mkdir -p "$BUILD_ARTIFACTS_DIR"
          dpkg-buildpackage -us -uc -b
          find .. -maxdepth 1 -type f \( -name '*.deb' -o -name '*.buildinfo' -o -name '*.changes' \) -exec cp -t "$BUILD_ARTIFACTS_DIR" {} +
      - name: Import GPG key
        env:
          REPREPRO_GPG_PRIVATE_KEY: ${{ secrets.REPREPRO_GPG_PRIVATE_KEY }}
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$REPREPRO_GPG_PRIVATE_KEY" > "$key_file"
          gpg --batch --import "$key_file"
          gpg -K
      - name: Create reprepro repo
        env:
          BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/debian-artifacts
          REPREPRO_GPG_KEY_ID: ${{ secrets.REPREPRO_GPG_KEY_ID }}
        run: |
          mkdir -p repo/conf
          sign_with=no
          if [ -n "$REPREPRO_GPG_KEY_ID" ]; then
            sign_with="$REPREPRO_GPG_KEY_ID"
          fi
          cat > repo/conf/distributions <<EOF
          Origin: debian.adamanteye.cc
          Label: Debian
          Suite: stable
          Codename: trixie
          Components: main
          Architectures: source amd64 arm64
          SignWith: ${sign_with}
          Description: debian packages created by adamanteye
          EOF
          found=0
          for artifact in "$BUILD_ARTIFACTS_DIR"/*.deb; do
            if [ ! -e "$artifact" ]; then
              continue
            fi
            found=1
            reprepro -b repo includedeb trixie "$artifact"
          done
          if [ "$found" -eq 0 ]; then
            echo "No .deb artifacts found in $BUILD_ARTIFACTS_DIR" >&2
            exit 1
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: repo/
          retention-days: 1
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: repo/
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages publish repo --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
